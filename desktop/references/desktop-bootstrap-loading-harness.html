<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台初始化状态验收</title>
  <link rel="stylesheet" href="../src/renderer/styles/auth.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate"></div>
  <script>
    (() => {
      const callbacks = new Set();
      const pendingStatus = [];
      const ready = {
        usable:true,
        authenticated:true,
        workspaceReady:true,
        state:'authenticated',
        tenantId:'tenant-bootstrap-test',
        user:{id:'user-bootstrap-test',username:'验收用户',email:'bootstrap@example.com'},
        tenant:{id:'tenant-bootstrap-test',code:'bootstrap-test',displayName:'初始化验收空间'},
        permissions:['desktop.bootstrap'],
        bootstrap:{state:'ready',data:{schemaVersion:1},error:null}
      };
      const stats = {statusCalls:0,bootstrapCalls:0};
      const clone = value => JSON.parse(JSON.stringify(value));
      window.lingframe = {
        window:{minimize:()=>Promise.resolve(),close:()=>Promise.resolve()},
        auth:{
          status:()=>{stats.statusCalls += 1;return new Promise(resolve=>pendingStatus.push(resolve));},
          bootstrap:()=>{stats.bootstrapCalls += 1;return Promise.resolve(clone(ready));},
          login:()=>Promise.resolve(clone(ready)),
          register:()=>Promise.resolve(clone(ready)),
          selectTenant:()=>Promise.resolve(clone(ready)),
          logout:()=>Promise.resolve({authenticated:false,workspaceReady:false}),
          onChanged:handler=>{if(typeof handler==='function')callbacks.add(handler);}
        }
      };
      window.__bootstrapHarness = {
        emitReady:()=>{for(const callback of callbacks)callback(clone(ready));},
        resolveStatus:()=>{for(const resolve of pendingStatus.splice(0))resolve(clone(ready));},
        stats:()=>clone(stats)
      };
    })();
  </script>
  <script src="../src/renderer/auth-ui.js"></script>
</body>
</html>
