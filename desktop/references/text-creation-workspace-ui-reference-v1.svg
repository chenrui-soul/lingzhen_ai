    <style>
      .ui{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#dbe9fa}.muted{fill:#7891b3}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:18px}.title{font-size:23px;font-weight:700}.head{font-size:14px;font-weight:700;letter-spacing:1px}.chip{font-size:12px}.line{stroke:#25405f;stroke-width:1}.cyan{fill:#55ddff}.violet{fill:#a58bff}.amber{fill:#ffbf76}.green{fill:#62e4bd}
    </style>
