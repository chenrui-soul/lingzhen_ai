  <rect x="1140" y="166" width="422" height="38" rx="8" fill="#1d3957"/><text x="1158" y="191" class="ui small">资料研究</text><text x="1245" y="191" class="ui muted small">AI分析</text><text x="1313" y="191" class="ui muted small">灵感候选</text><text x="1410" y="191" class="ui muted small">人物设定</text>
  <text x="1148" y="239" class="ui head cyan">资料研究</text><rect x="1148" y="256" width="402" height="85" rx="9" fill="#10243d"/><text x="1164" y="282" class="ui small">项目资料 · 云海古城世界观.md</text><text x="1164" y="308" class="ui muted tiny">已提取：城门历史、银色徽记、灯塔位置</text><text x="1164" y="330" class="ui cyan tiny">查看原文　·　引用到正文</text>
  <text x="1148" y="375" class="ui head violet">AI分析</text><rect x="1148" y="392" width="402" height="93" rx="9" fill="#10243d"/><text x="1164" y="418" class="ui small">人物一致性　<tspan class="green">良好</tspan></text><text x="1164" y="444" class="ui small">时间线　　　　<tspan class="amber">发现 1 个待确认点</tspan></text><text x="1164" y="469" class="ui muted tiny">第三章灯塔线索与当前徽记关联较弱</text>
  <text x="1148" y="519" class="ui head violet">灵感候选</text><rect x="1148" y="536" width="402" height="118" rx="9" fill="#10243d"/><text x="1164" y="562" class="ui small">候选 A</text><text x="1164" y="588" class="ui muted tiny">钟声停下时，城门内亮起一盏不属于</text><text x="1164" y="608" class="ui muted tiny">任何人的灯。</text><rect x="1164" y="622" width="85" height="24" rx="6" fill="#1c4760"/><text x="1180" y="639" class="ui chip cyan">插入正文</text><rect x="1258" y="622" width="96" height="24" rx="6" fill="#263454"/><text x="1272" y="639" class="ui chip">保存为版本</text>
  <rect x="1148" y="678" width="402" height="78" rx="9" fill="#0c1b30" stroke="#294360"/><text x="1164" y="704" class="ui small">AI资料整理任务</text><text x="1164" y="730" class="ui muted tiny">正在分析 6 份项目资料　<tspan class="cyan">68%</tspan></text><rect x="1164" y="741" width="210" height="5" rx="3" fill="#203851"/><rect x="1164" y="741" width="143" height="5" rx="3" fill="url(#accent)"/>

