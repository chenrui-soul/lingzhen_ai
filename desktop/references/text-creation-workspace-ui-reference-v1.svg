  <rect x="1150" y="16" width="188" height="30" rx="8" fill="#112743" stroke="#294463"/><text x="1170" y="36" class="ui small">搜索项目、资料…</text><circle cx="1412" cy="31" r="17" fill="#223a5c"/><text x="1405" y="37" class="ui small">白</text><text x="1440" y="36" class="ui small">白同学</text>

  <rect x="18" y="78" width="244" height="750" rx="16" fill="url(#panel)" stroke="#203b5d" filter="url(#shadow)"/>
  <text x="42" y="112" class="ui head cyan">CREATIVE SPACE</text><text x="42" y="148" class="ui title">我的项目</text><text x="42" y="178" class="ui small">◆ 云海古城短剧计划</text><text x="42" y="207" class="ui muted small">◇ 广告文案实验室</text>
  <line x1="42" y1="232" x2="238" y2="232" class="line"/><text x="42" y="265" class="ui head violet">文档结构</text>
  <rect x="34" y="282" width="212" height="38" rx="8" fill="#1b3b5b"/><text x="52" y="307" class="ui small">▾ 第一章 迷雾入城</text><text x="66" y="342" class="ui muted small">第二章 灯塔来信</text><text x="66" y="374" class="ui muted small">第三章 风暴前夜</text>
  <text x="42" y="422" class="ui head violet">创作资料</text><text x="52" y="456" class="ui small">◈ 人物设定</text><text x="52" y="488" class="ui small">◈ 世界观</text><text x="52" y="520" class="ui small">◈ 时间线</text><text x="52" y="552" class="ui small">◈ 素材引用</text>
  <line x1="42" y1="584" x2="238" y2="584" class="line"/><text x="42" y="620" class="ui head violet">版本记录</text><text x="52" y="654" class="ui muted small">V1 初始草稿</text><text x="52" y="686" class="ui cyan small">V2 AI辅助后 · 当前</text><text x="52" y="718" class="ui muted small">V3 用户修订稿</text><rect x="42" y="758" width="176" height="36" rx="8" fill="url(#accent)"/><text x="78" y="782" class="ui small">＋ 新建创作</text>

  <rect x="280" y="78" width="820" height="750" rx="16" fill="#0d1b31" stroke="#203b5d" filter="url(#shadow)"/>
  <text x="314" y="118" class="ui title">云海古城 · 第一章</text><rect x="710" y="95" width="110" height="31" rx="7" fill="#172e4a" stroke="#315579"/><text x="735" y="116" class="ui small">小说　⌄</text><rect x="838" y="95" width="98" height="31" rx="7" fill="#172e4a"/><text x="858" y="116" class="ui small">保存版本</text><rect x="948" y="95" width="65" height="31" rx="7" fill="#172e4a"/><text x="965" y="116" class="ui small">预览</text><rect x="1024" y="95" width="55" height="31" rx="7" fill="#172e4a"/><text x="1038" y="116" class="ui small">导出</text>
  <line x1="314" y1="150" x2="1065" y2="150" class="line"/><text x="314" y="182" class="ui muted small">第一节　雾中的城门</text>
  <text x="314" y="226" class="ui body">夜色从山脊缓慢落下，云海古城的灯火一盏一盏亮起。</text><text x="314" y="262" class="ui body">沈砚站在旧城门前，手里攥着一封没有署名的信。</text>
  <rect x="307" y="282" width="730" height="39" rx="5" fill="#234b63" opacity=".62"/><text x="314" y="309" class="ui body">信封背面印着一枚陌生的银色徽记，像是某种被遗忘的誓言。</text>
  <rect x="438" y="323" width="270" height="36" rx="8" fill="#1a3151" stroke="#4bdcff"/><text x="454" y="346" class="ui chip cyan">续写</text><text x="500" y="346" class="ui chip">润色</text><text x="548" y="346" class="ui chip">扩写</text><text x="596" y="346" class="ui chip">转剧本</text><text x="670" y="346" class="ui chip violet">提取人物</text>
  <text x="314" y="405" class="ui body">他抬头望向城墙。雾气在砖缝间游走，远处传来三声钟响，</text><text x="314" y="441" class="ui body">每一声都比上一声更近。城门内没有守卫，只有一条被雨水</text><text x="314" y="477" class="ui body">洗得发白的石板路，通向看不见尽头的旧城区。</text>
  <text x="314" y="544" class="ui muted small">写作提示：保持沈砚的谨慎性格，埋下“银色徽记”与第三章灯塔的关联。</text>
  <rect x="314" y="596" width="710" height="136" rx="10" fill="#0a1628" stroke="#1c3654"/><text x="334" y="626" class="ui head cyan">人工创作区</text><text x="334" y="658" class="ui muted small">这里始终由你决定正文。AI建议会先进入候选区，不会自动覆盖原稿。</text><text x="334" y="696" class="ui muted small">当前字数 1,286　·　自动保存正常　·　最后保存 20:36</text>

  <rect x="1120" y="78" width="462" height="750" rx="16" fill="url(#panel)" stroke="#203b5d" filter="url(#shadow)"/>
